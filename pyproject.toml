[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-fleet"
version = "0.1.0"
description = "Emulated PLCs for the AquaFlow Systems treatment plant"
requires-python = ">=3.14"
dependencies = [
    "pymodbus==3.7.4",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
include = ["plc_fleet*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.pytest.ini_options]
pythonpath = ["."]